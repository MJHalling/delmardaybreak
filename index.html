<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Del Mar Daybreak</title>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;

    background-color: #0a0a0a;
    background-image: linear-gradient(
      180deg,
      #3b3b3b 0%,
      #222222 45%,
      #0a0a0a 100%
    );

    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;

    color: #e0e0e0;
  }

  h1 {
    text-align: center;
    margin: 24px 0 4px;
    font-size: 2em;
    color: #e0e0e0;
  }

  #subtitle {
    text-align: center;
    font-size: 1em;
    margin-bottom: 20px;
    color: #aaa;
  }

  .schedule {
    max-width: 650px;
    margin: 0 auto 40px;
    border: 1px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }

  .block {
    display: flex;
    align-items: center;
    min-height: 62px;
    border-bottom: 1px solid #444;
    transition: background-color 0.3s ease;
  }

  .block:last-child {
    border-bottom: none;
  }

  .icon-col {
    width: 65px;
    min-height: 62px;
    align-self: stretch;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 1.7em;
  }

  .label-col {
    flex: 1;
    padding: 14px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
  }

  .time-label {
    white-space: nowrap;
  }

  .status {
    text-align: right;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .schedule {
      margin-left: 12px;
      margin-right: 12px;
    }

    .label-col {
      font-size: 0.9em;
    }

    .status {
      font-size: 0.9em;
    }
  }
</style>
</head>

<body>

<h1>Del Mar Daybreak</h1>
<div id="subtitle"></div>

<div class="schedule" id="schedule"></div>

<script>

const blocks = [
  {
    label: "Training",
    start: "4:30 AM",
    end: "6:00 AM",
    icon: "🏇",
    color: "#0067A0"
  },
  {
    label: "Renovation #1",
    start: "6:00 AM",
    end: "6:30 AM",
    icon: "🚜",
    color: "#C88A00"
  },
  {
    label: "Training",
    start: "6:30 AM",
    end: "7:15 AM",
    icon: "🏇",
    color: "#0067A0"
  },
  {
    label: "Renovation #2",
    start: "7:15 AM",
    end: "7:45 AM",
    icon: "🚜",
    color: "#C88A00"
  },
  {
    label: "Training",
    start: "7:45 AM",
    end: "8:30 AM",
    icon: "🏇",
    color: "#0067A0"
  },
  {
    label: "Renovation #3",
    start: "8:30 AM",
    end: "9:00 AM",
    icon: "🚜",
    color: "#C88A00"
  },
  {
    label: "Training",
    start: "9:00 AM",
    end: "10:00 AM",
    icon: "🏇",
    color: "#0067A0"
  }
];


function getCurrentTimeInSeconds() {
  const now = new Date();

  return (
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds()
  );
}


function timeToSeconds(timeStr) {

  const [time, meridian] = timeStr.split(" ");

  let [hours, minutes] = time
    .split(":")
    .map(Number);

  if (meridian === "PM" && hours !== 12) {
    hours += 12;
  }

  if (meridian === "AM" && hours === 12) {
    hours = 0;
  }

  return hours * 3600 + minutes * 60;
}


function formatTimeLabel(timeStr) {

  const [time, meridian] = timeStr.split(" ");

  return time + meridian.toLowerCase();
}


function formatCountdown(secondsLeft) {

  const minutes = Math.floor(secondsLeft / 60);

  return `${minutes}m`;
}


function updateSubtitle() {

  const now = new Date();

  const options = {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "numeric",
    minute: "numeric",
    second: "numeric"
  };

  document.getElementById("subtitle").textContent =
    now.toLocaleString("en-US", options);
}


function renderSchedule() {

  const container =
    document.getElementById("schedule");

  container.innerHTML = "";

  const now = getCurrentTimeInSeconds();


  blocks.forEach(block => {

    const start =
      timeToSeconds(block.start);

    const end =
      timeToSeconds(block.end);

    const isActive =
      now >= start && now < end;

    const secondsLeft =
      end - now;

    const totalSeconds =
      end - start;


    // 15-minute progress segments

    const segmentSize = 900;

    const totalSegments =
      Math.max(
        1,
        Math.ceil(totalSeconds / segmentSize)
      );

    const elapsed =
      now - start;

    const currentSegment =
      Math.min(
        totalSegments - 1,
        Math.max(
          0,
          Math.floor(elapsed / segmentSize)
        )
      );


    let progressLine = "| ";

    for (
      let i = 0;
      i < totalSegments;
      i++
    ) {

      progressLine +=
        i === currentSegment
          ? block.icon
          : "—";

      progressLine += " ";
    }

    progressLine += "|";


    const row =
      document.createElement("div");

    row.className = "block";


    if (isActive) {
      row.style.backgroundColor =
        block.color;

      row.style.color = "#ffffff";
    }


    const iconCol =
      document.createElement("div");

    iconCol.className = "icon-col";

    iconCol.textContent =
      block.icon;

    iconCol.style.backgroundColor =
      block.color;


    const labelCol =
      document.createElement("div");

    labelCol.className = "label-col";


    const timeLabel =
      document.createElement("span");

    timeLabel.className =
      "time-label";

    timeLabel.textContent =
      `${formatTimeLabel(block.start)} - ` +
      `${formatTimeLabel(block.end)} • ` +
      `${block.label}`;


    const status =
      document.createElement("span");

    status.className = "status";


    if (isActive) {

      status.textContent =
        `${formatCountdown(secondsLeft)} ` +
        `${progressLine}`;
    }


    labelCol.appendChild(timeLabel);
    labelCol.appendChild(status);

    row.appendChild(iconCol);
    row.appendChild(labelCol);

    container.appendChild(row);
  });
}


setInterval(renderSchedule, 1000);
setInterval(updateSubtitle, 1000);

renderSchedule();
updateSubtitle();

</script>

</body>
</html>
